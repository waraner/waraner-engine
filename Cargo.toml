[package]
name = "waraner-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "waraner_client"
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[[bin]]
name = "game"
path = "src/bin/game.rs"

[[bin]]
name = "waraner_demo"
path = "src/demo.rs"

[[bin]]
name = "wbuild"
path = "src/bin/wbuild.rs"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
wgpu = "27"
winit = { version = "0.29", features = ["rwh_06"] }
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
glam = { version = "0.24", features = ["bytemuck"] }
env_logger = "0.10"
log = "0.4"
imgui = "0.12"
imgui-wgpu = "0.26"
crossbeam = "0.8"
box3d-rust = "0.2.0"
image = "0.25"
tobj = "4.0"
gltf = "1.4"
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "mp3"] }
mlua = { version = "0.10", features = ["lua54", "vendored"], default-features = false }
zstd = "0.13"
lz4 = "1.28"
flate2 = "1.0"
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
noble-physics = { path = "libs/noble-physics" }
